<!doctype html>
<html lang="zh-Hant">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>旅途手帳｜旅遊行程規劃</title>
<style>
:root{font-family:system-ui,sans-serif;color:#182c2e;background:#f2f6f4;--green:#00665b;--line:#d9e5df}
*{box-sizing:border-box}body{margin:0}main,nav{max-width:1120px;margin:auto;padding:0 24px}header{background:#fff;border-bottom:1px solid var(--line)}nav{min-height:69px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}nav strong{font-size:1.25rem}button,input,textarea,select{font:inherit}button{cursor:pointer;border:1px solid var(--line);border-radius:10px;padding:9px 14px;background:white;color:inherit}button:hover{border-color:var(--green)}button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #23a996;outline-offset:2px}.primary,[aria-pressed=true]{background:var(--green);color:white;border-color:var(--green)}.hero{margin:28px 0 24px;padding:clamp(24px,6vw,64px);border-radius:24px;color:white;background:radial-gradient(ellipse at 82% 20%,#387c66 0%,transparent 56%),linear-gradient(125deg,#123c3e,#175c50);overflow-wrap:anywhere}.hero p{margin:0;color:#d5efdf}.hero h1{font-size:clamp(2rem,6vw,4rem);margin:10px 0 18px;line-height:1.15}.hero button{margin-top:19px;color:#123c3e}.layout{display:grid;grid-template-columns:1fr 300px;gap:24px;margin-bottom:48px}.panel{padding:23px;background:white;border:1px solid var(--line);border-radius:18px;min-width:0}.row,.actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.between{justify-content:space-between}.days{padding:0 0 16px;border-bottom:1px solid var(--line)}h2{margin:0;font-size:1.35rem}h3,p{overflow-wrap:anywhere}.item{display:grid;grid-template-columns:60px minmax(0,1fr);gap:13px;padding:18px 0;border-bottom:1px solid var(--line)}.item:last-child{border-bottom:0}.item time{font-variant-numeric:tabular-nums;color:var(--green);font-weight:700}.item h3{margin:8px 0 4px}.item p{margin:5px 0 12px;white-space:pre-wrap}.badge{background:#e7f4ec;border-radius:6px;padding:3px 8px;font-size:.875rem}.muted,small{color:#4e665f}.amount{font-size:1.8rem;font-weight:750;margin:8px 0}.budget-row{display:flex;justify-content:space-between;gap:12px;margin:12px 0}meter{width:100%;height:15px}a{color:var(--green)}dialog{width:min(95vw,500px);max-height:90vh;border:0;border-radius:16px;padding:24px;color:inherit}dialog::backdrop{background:#102d33a6}form label{display:grid;gap:5px;margin:12px 0}input,select,textarea{width:100%;padding:8px;border:1px solid #a3bbb0;border-radius:7px;background:white;color:inherit}.fields{display:grid;grid-template-columns:1fr 1fr;gap:12px}.danger{color:#982b28}.empty{padding:20px 0}.status{margin-top:10px;min-height:1.5em}
@media(max-width:760px){.layout{grid-template-columns:1fr}.hero{margin-top:18px}}@media(max-width:400px){main,nav{padding-inline:12px}.panel{padding:15px}.fields{grid-template-columns:1fr}}
@media print{header,button,.status{display:none!important}.layout{display:block}.panel,.hero{background:white;color:black;break-inside:avoid}.hero p{color:black}}
</style>
<header><nav><strong>旅途手帳</strong><div class="actions"><button id="backup">下載備份</button><button id="restore">匯入備份</button><input id="backup-file" type="file" accept=".json,application/json" hidden></div></nav></header>
<main>
<section class="hero"><p id="destination"></p><h1 id="trip-title"></h1><p id="trip-dates"></p><button id="trip-edit">編輯旅程</button></section>
<div class="layout">
<section class="panel" aria-label="每日行程"><div id="days" class="row days" aria-label="選擇日期"></div><div class="row between" style="margin-top:18px"><h2 id="day-title">每日行程</h2><button id="add" class="primary">＋ 新增活動</button></div><div id="activities"></div></section>
<aside class="panel" aria-label="旅程預算"><h2>旅程預算</h2><p class="muted">全程預估支出</p><p id="total" class="amount"></p><div id="budget-details"></div><div id="breakdown"></div><p class="muted">行程自動儲存在此瀏覽器。換裝置時，可下載並匯入備份。</p><p class="status" id="status" role="status"></p></aside>
</div>
</main>
<dialog id="trip-dialog" aria-labelledby="trip-dialog-title">
<form id="trip-form"><h2 id="trip-dialog-title">編輯旅程</h2>
<label>旅程名稱<input name="title" required maxlength="80"></label>
<label>目的地<input name="destination" maxlength="80"></label>
<div class="fields"><label>出發日期<input type="date" name="start" required></label><label>結束日期<input type="date" name="end" required></label></div>
<div class="fields"><label>預算上限<input type="number" name="budget" min="0" max="999999999" step="0.01" required></label><label>幣別<select name="currency"><option>TWD</option><option>JPY</option><option>USD</option><option>EUR</option><option>KRW</option><option>HKD</option></select></label></div>
<p class="muted">修改幣別只會更換金額標示。縮短日期前，請先移動或移除範圍外的活動。</p>
<div class="actions"><button type="button" data-close>取消</button><button class="primary">儲存旅程</button></div></form>
</dialog>
<dialog id="activity-dialog" aria-labelledby="activity-dialog-title">
<form id="activity-form"><h2 id="activity-dialog-title">新增活動</h2>
<label>活動名稱<input name="title" required maxlength="100"></label>
<div class="fields"><label>日期<select name="date"></select></label><label>時間<input type="time" name="time"></label></div>
<div class="fields"><label>類別<select name="category"><option>景點</option><option>餐飲</option><option>交通</option><option>住宿</option><option>其他</option></select></label><label>預估費用<input type="number" name="cost" min="0" max="999999999" step="0.01"></label></div>
<label>地點<input name="place" maxlength="150"></label><label>備註<textarea name="notes" rows="3" maxlength="1000"></textarea></label>
<div class="actions"><button type="button" data-close>取消</button><button class="primary">儲存活動</button></div></form>
</dialog>
<script>
'use strict';
const $ = id => document.getElementById(id);
const key = 'travel-notebook-v1';
const categories = ['景點', '餐飲', '交通', '住宿', '其他'];
const currencies = ['TWD', 'JPY', 'USD', 'EUR', 'KRW', 'HKD'];
const dayMs = 86400000;
const dateValue = value => Date.parse(value + 'T00:00:00Z');
const iso = value => new Date(value).toISOString().slice(0, 10);
const short = value => new Intl.DateTimeFormat('zh-TW', {month:'numeric', day:'numeric', weekday:'short', timeZone:'UTC'}).format(dateValue(value));
const localToday = new Intl.DateTimeFormat('sv-SE', {year:'numeric', month:'2-digit', day:'2-digit'}).format(new Date());
const initial = {title:'我的下一趟旅行', destination:'', start:localToday, end:iso(dateValue(localToday) + dayMs * 2), budget:0, currency:'TWD', items:[]};
const validDate = value => typeof value === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(value) && Number.isFinite(dateValue(value)) && iso(dateValue(value)) === value;
const validText = (value, max) => typeof value === 'string' && value.length <= max;
const validMoney = value => Number.isFinite(value) && value >= 0 && value <= 999999999;
function validTrip(trip) {
  if (!trip || !validText(trip.title,80) || !trip.title.trim() || !validText(trip.destination,80) ||
      !validDate(trip.start) || !validDate(trip.end) || trip.start > trip.end ||
      dateValue(trip.end) - dateValue(trip.start) >= 366 * dayMs ||
      !currencies.includes(trip.currency) || !validMoney(trip.budget) || !Array.isArray(trip.items)) return false;
  const ids = new Set();
  return trip.items.every(item => {
    if (!item || !validText(item.id,80) || !item.id || ids.has(item.id)) return false;
    ids.add(item.id);
    return validText(item.title,100) && item.title.trim() && validDate(item.date) &&
      item.date >= trip.start && item.date <= trip.end && validText(item.time,5) &&
      (!item.time || /^([01]\d|2[0-3]):[0-5]\d$/.test(item.time)) &&
      categories.includes(item.category) && validMoney(item.cost) &&
      validText(item.place,150) && validText(item.notes,1000);
  });
}
function notify(message) { $('status').textContent = message; }
let trip = initial;
try {
  const saved = localStorage.getItem(key);
  if (saved) {
    const parsed = JSON.parse(saved);
    if (!validTrip(parsed)) throw new Error();
    trip = parsed;
  }
} catch { notify('無法讀取先前行程。可嘗試匯入已下載的備份。'); }
let day = trip.start;
let editing = null;
const tripForm = $('trip-form');
const activityForm = $('activity-form');
const money = value => new Intl.NumberFormat('zh-TW', {style:'currency', currency:trip.currency, currencyDisplay:'code', maximumFractionDigits:2}).format(value);
function element(tag, content, className) {
  const result = document.createElement(tag);
  if (content !== undefined) result.textContent = content;
  if (className) result.className = className;
  return result;
}
function button(label, action) {
  const control = element('button', label);
  control.type = 'button';
  control.onclick = action;
  return control;
}
function dates() {
  const result = [];
  for (let value = dateValue(trip.start); value <= dateValue(trip.end); value += dayMs) result.push(iso(value));
  return result;
}
function save(message) {
  render();
  try {
    localStorage.setItem(key, JSON.stringify(trip));
    notify(message || '已儲存');
  } catch { notify('瀏覽器無法儲存，請下載備份。'); }
}
function render() {
  $('trip-title').textContent = trip.title;
  $('destination').textContent = trip.destination;
  $('trip-dates').textContent = trip.start + ' 至 ' + trip.end + ' · ' + dates().length + ' 天';
  $('day-title').textContent = short(day) + '行程';
  $('days').replaceChildren(...dates().map((date,index) => {
    const control = button('第 ' + (index + 1) + ' 天 · ' + short(date), () => {
      day = date;
      render();
      $('days').children[index].focus();
    });
    control.setAttribute('aria-pressed', String(date === day));
    return control;
  }));
  const items = trip.items.filter(item => item.date === day).sort((a,b) => (a.time || '99:99').localeCompare(b.time || '99:99'));
  $('activities').replaceChildren(...items.map(activityCard));
  if (!items.length) $('activities').append(element('p','這天還沒有活動。點選「新增活動」開始安排。','muted empty'));
  const total = trip.items.reduce((sum,item) => sum + Math.round(item.cost * 100),0) / 100;
  $('total').textContent = money(total);
  $('budget-details').replaceChildren();
  if (trip.budget > 0) {
    const remaining = Math.round(trip.budget * 100 - total * 100) / 100;
    const meter = element('meter');
    meter.max = trip.budget;
    meter.value = Math.min(total,trip.budget);
    meter.setAttribute('aria-label','預算使用比例');
    $('budget-details').append(meter,element('p',(remaining < 0 ? '超出預算 ' : '剩餘預算 ') + money(Math.abs(remaining)),remaining < 0 ? 'danger' : 'muted'));
  } else {
    $('budget-details').append(element('p','可在「編輯旅程」設定預算上限。','muted'));
  }
  $('breakdown').replaceChildren(...categories.map(category => {
    const amount = trip.items.filter(item => item.category === category).reduce((sum,item) => sum + Math.round(item.cost * 100),0) / 100;
    const row = element('div',undefined,'budget-row');
    row.append(element('span',category),element('strong',money(amount)));
    return row;
  }));
}
function activityCard(item) {
  const article = element('article',undefined,'item');
  const body = element('div');
  body.append(element('span',item.category,'badge'),element('h3',item.title));
  if (item.place) {
    const map = element('a',item.place + ' · 地圖');
    map.href = 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(item.place);
    map.target = '_blank';
    map.rel = 'noopener noreferrer';
    body.append(map);
  }
  if (item.notes) body.append(element('p',item.notes,'muted'));
  const actions = element('div',undefined,'row');
  actions.append(element('span',money(item.cost),'muted'),button('編輯',() => openActivity(item)),button('刪除',() => {
    if (!confirm('刪除「' + item.title + '」？')) return;
    trip.items = trip.items.filter(activity => activity.id !== item.id);
    save('已刪除活動');
    $('add').focus();
  }));
  body.append(actions);
  article.append(element('time',item.time || '未定'),body);
  return article;
}
function openActivity(item) {
  editing = item?.id || null;
  activityForm.reset();
  $('activity-dialog-title').textContent = item ? '編輯活動' : '新增活動';
  activityForm.elements.date.replaceChildren(...dates().map(date => new Option(short(date),date)));
  activityForm.elements.date.value = day;
  if (item) for (const [name,value] of Object.entries(item)) {
    if (activityForm.elements.namedItem(name)) activityForm.elements.namedItem(name).value = value;
  }
  $('activity-dialog').showModal();
}
$('trip-edit').onclick = () => {
  for (const name of ['title','destination','start','end','budget','currency']) tripForm.elements[name].value = trip[name];
  $('trip-dialog').showModal();
};
$('add').onclick = () => openActivity();
for (const control of document.querySelectorAll('[data-close]')) control.onclick = () => control.closest('dialog').close();
for (const form of [tripForm,activityForm]) form.oninput = event => event.target.setCustomValidity('');
tripForm.onsubmit = event => {
  event.preventDefault();
  const fields = Object.fromEntries(new FormData(tripForm));
  const candidate = {...trip,...fields,title:fields.title.trim(),destination:fields.destination.trim(),budget:Number(fields.budget)};
  if (!candidate.title) {
    tripForm.elements.title.setCustomValidity('請輸入旅程名稱。');
    tripForm.reportValidity();
    return;
  }
  if (!validTrip(candidate)) {
    alert('請確認日期順序、旅程在 366 天內，且所有活動都在新日期範圍內。');
    return;
  }
  trip = candidate;
  if (day < trip.start || day > trip.end) day = trip.start;
  $('trip-dialog').close();
  save();
};
activityForm.onsubmit = event => {
  event.preventDefault();
  const fields = Object.fromEntries(new FormData(activityForm));
  const title = fields.title.trim();
  if (!title) {
    activityForm.elements.title.setCustomValidity('請輸入活動名稱。');
    activityForm.reportValidity();
    return;
  }
  const item = {...fields,title,place:fields.place.trim(),cost:Number(fields.cost),id:editing || String(Date.now()) + '-' + Math.random().toString(36).slice(2)};
  trip.items = editing ? trip.items.map(previous => previous.id === editing ? item : previous) : [...trip.items,item];
  day = item.date;
  $('activity-dialog').close();
  save('已儲存活動');
};
$('backup').onclick = () => {
  const url = URL.createObjectURL(new Blob([JSON.stringify(trip,null,2)],{type:'application/json'}));
  const link = element('a');
  link.href = url;
  link.download = 'travel-notebook.json';
  link.click();
  setTimeout(() => URL.revokeObjectURL(url),1000);
};
$('restore').onclick = () => $('backup-file').click();
$('backup-file').onchange = async event => {
  const file = event.target.files[0];
  event.target.value = '';
  if (!file) return;
  try {
    const candidate = JSON.parse(await file.text());
    if (!validTrip(candidate)) throw new Error();
    if (!confirm('用備份取代目前的旅程？')) return;
    trip = candidate;
    day = trip.start;
    save('已匯入備份');
  } catch { notify('無法匯入。請選擇由旅途手帳下載的 JSON 備份。'); }
};
render();
</script>
</html>
